[tox]
requires = tox>=4
envlist = type, lint, coverage, docs, py{311,312,313,314,315}-tests

[testenv]
description = Base Environment
extras = test
set_env =
    COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
commands_pre =
    {envpython} --version
commands =
    coverage run --rcfile pyproject.toml -m pytest {posargs}

[testenv:py{311,312,313,314,315}-tests]
description = Run Unit Tests
commands_pre =
    {envpython} --version
    {envpython} -c 'import pathlib; pathlib.Path("{env_site_packages_dir}/cov.pth").write_text("import coverage; coverage.process_startup()")'

[testenv:coverage]
description = Report Code Coverage
skip_install = true
deps = coverage
parallel_show_output = true
depends = py{311,312,313,314,315}-tests
commands =
    coverage combine --quiet --rcfile pyproject.toml
    coverage report --rcfile pyproject.toml {posargs}

[testenv:type]
description = Run Static Type Check
extras = type
commands =
    mypy --config-file pyproject.toml {posargs: src}

[testenv:lint]
description = Run Code Linting
extras = lint
commands =
    ruff check --config pyproject.toml src/ tests/
    ruff format --check --config pyproject.toml src/ tests/
    pylint --rcfile pyproject.toml src/

[testenv:docs]
changedir = docs
extras = doc
allowlist_externals = rm
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees source {envtmpdir}/html
commands_post =
    rm -rf {envtmpdir}
