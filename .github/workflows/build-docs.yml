name: Build Docs

on:
  push:
    branches: [ main, dev ]
    tags: [ v* ]

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ">=0.13.10,<0.14.0"

      - name: Install dependencies
        run: |
          uv sync --locked --no-editable --extra doc

      - name: Build documentation
        run: |
          uv run --frozen sphinx-multiversion docs/source _build

      - name: Add Redirect Page
        # NOTE: when only one version is built, it is not within a separate directory
        if: ${{ hashFiles('_build/index.html') == '' }}
        run: |
          cp docs/source/_templates/redirect.html _build/index.html

      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v84c30a85c19949d7eee79c4ff27748b70285e453 #v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build
          publish_branch: gh-pages
          force_orphan: true
